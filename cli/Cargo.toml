[package]
name = "cannbot-cli"
description = "CLI frontend for the CANNBot adapter (Linux, no GUI dependencies)"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "cannbotcli"
path = "src/main.rs"

[dependencies]
cannbot-core.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
