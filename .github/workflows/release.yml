name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Export Apple signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export non-empty values: tauri-cli treats an empty-string
          # APPLE_* env var as a real (invalid) credential and fails the build.
          for var in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!var}"
            if [ -n "$value" ]; then
              echo "$var=$value" >> "$GITHUB_ENV"
              echo "Exported $var"
            fi
          done

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "cannbot-adapter ${{ github.ref_name }}"
          releaseBody: |
            本地 OpenAI 兼容适配器，将 CANNBot 网关暴露为标准 /v1 接口。

            - macOS: aarch64 (Apple Silicon) dmg
            - Windows: msi + nsis 安装包
            - Linux: cannbotcli 命令行版（见 cannbotcli-linux-x86_64.tar.gz，附 cbc 别名）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Linux CLI: pure-Rust binary with no GUI dependencies. Runs after `build`
  # so the draft release already exists for `gh release upload` to attach to.
  cli:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build CLI (release)
        run: cargo build --release -p cannbot-cli

      - name: Package
        run: |
          cd src-tauri/target/release
          ln -sf cannbotcli cbc
          tar czf "$GITHUB_WORKSPACE/cannbotcli-linux-x86_64.tar.gz" cannbotcli cbc
          cd "$GITHUB_WORKSPACE"
          sha256sum cannbotcli-linux-x86_64.tar.gz > cannbotcli-linux-x86_64.tar.gz.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            cannbotcli-linux-x86_64.tar.gz \
            cannbotcli-linux-x86_64.tar.gz.sha256 \
            --clobber
