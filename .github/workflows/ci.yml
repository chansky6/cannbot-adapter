name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: svelte-check (type check)
        run: npm run check

      - name: Frontend build
        run: npm run build

  # core + cli have no GUI dependencies — lint and test them without
  # installing any Tauri system libraries (this is also the proof that the
  # CLI builds on headless Linux).
  core-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p cannbot-core -p cannbot-cli -- -D warnings

      - name: Tests
        run: cargo test -p cannbot-core -p cannbot-cli

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy -p cannbot-adapter -- -D warnings

      - name: Tests
        run: cargo test -p cannbot-adapter
